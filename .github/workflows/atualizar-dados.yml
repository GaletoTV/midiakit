name: Atualizar dados e publicar mídia kit

on:
  schedule:
    # de 15 em 15 dias: dias 1 e 15 de cada mês às 06h17 (horário de Brasília). O horário do cron é em UTC.
    - cron: "17 9 1,15 * *"
  workflow_dispatch: {}      # botão "Run workflow" para atualizar na hora
  push:
    branches: [main]         # republica quando você editar o site (inclusive pelo Pages CMS)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Coletar dados do Instagram
        if: env.IG_ACCESS_TOKEN != ''
        run: python scripts/fetch_instagram.py

      - name: Aviso (sem token)
        if: env.IG_ACCESS_TOKEN == ''
        run: echo "::warning::Segredo IG_ACCESS_TOKEN não configurado — o painel continua com os dados de demonstração."

      - name: Salvar dados no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza dados do Instagram ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # A publicação às vezes falha ao achar o pacote ("No artifacts named
      # github-pages"); nesse caso espera um pouco e tenta de novo.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Esperar antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
