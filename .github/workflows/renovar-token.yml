name: Renovar token do Instagram

# O token do Instagram vale 60 dias. Este fluxo o renova nos dias 1 e 15 de cada mês.
# Para gravar o token novo sozinho, ele precisa do segredo GH_PAT (veja o README).

on:
  schedule:
    - cron: "41 13 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renovar:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pedir token renovado
        if: env.IG_ACCESS_TOKEN != ''
        run: python scripts/fetch_instagram.py --refresh-token

      - name: Gravar o novo token no segredo IG_ACCESS_TOKEN
        if: env.IG_ACCESS_TOKEN != '' && env.GH_PAT != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "::add-mask::$(cat .novo_token)"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < .novo_token
          rm -f .novo_token
          echo "Segredo atualizado."

      - name: Aviso (sem GH_PAT)
        if: env.GH_PAT == ''
        run: echo "::warning::Sem o segredo GH_PAT o token não é gravado automaticamente. Renove manualmente a cada ~50 dias (veja o README)."
